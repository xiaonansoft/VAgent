# =====================================================================
# 提钒冶炼行业基线知识包 (VERO Knowledge Pack)
# =====================================================================
# 定位: 产品面向「提钒冶炼」这个行业 (行业级), 而非某一家厂。
# 本包只放「跨厂一致」的行业通用规则; 厂级差异(查表值/枪位值/阈值/配方)由厂级包覆盖。
# scope 分层: 行业基线(industry) < 厂(plant) < 车间(workshop) < 炉座(furnace) < 炉次
#
# 每个参数必备: value/unit/source(溯源); 未经验证的不写 (拒绝凭空/不实)。
# =====================================================================

schema: vero.knowledge-pack/v1
pack:
  plant: industry
  scope: industry
  name: 提钒冶炼行业基线知识包
  version: 1.0.0
  status: draft
  approved_by: []

parameters:

  # -------------------------------------------------------------------
  # 枪位控制模式 (行业通用, 多方文献一致, 非某厂专属)
  # -------------------------------------------------------------------
  lance_mode:
    standard:
      value: "低-高-低"
      desc: "点火/前期低枪位 → 主吹高枪位(软吹化渣、保碳) → 终点压枪低枪位(降渣中FeO)"
      source: "攀钢综述「枪位 低→高→低」; 讲课稿「低—高—低」; 黑龙江建龙 p22"
    high_si_rule:
      value: "枪位保持下限"
      desc: "高 Si 时全程低枪位, 抑制脱碳、保钒"
      source: "黑龙江建龙 p16「铁水含硅量高时, 枪位均保持下限」; 下钢(苏联)综述同"

  # -------------------------------------------------------------------
  # 去钒保碳原理 (热力学)
  # -------------------------------------------------------------------
  thermodynamics:
    principle:
      value: "去钒保碳"
      desc: "低温下 V 优先氧化进入钒渣, C 氧化被抑制; 超过碳钒转化温度后脱碳加速"
      source: "讲课稿 §转炉提钒原理; MODEL_ALGORITHM.md §2"
    carbon_vanadium_transition_temp_c:
      value: 1361
      unit: "℃"
      source: "吉布斯自由能推导: ΔG7=-250170+153.09T → T转=250170/153.09=1634K=1361℃; 文献/讲课稿/知识库多方一致"
      note: "1360 系四舍五入; 动力学 sigmoid 中心 1380 与诊断「终点<1380」为操作阈值, 非 Tc (见 known_conflicts CF-007)"

  # -------------------------------------------------------------------
  # 终点控制通用目标 (行业硬约束)
  # -------------------------------------------------------------------
  endpoint:
    semi_steel_v_residual_max_pct:
      value: 0.03
      unit: "%"
      source: "Source 106 硬约束: 半钢残钒 ≤0.03%"
    keep_carbon:
      value: "保碳"
      desc: "半钢需保留足够碳 (下限 3.1~3.5% 系厂级差异, 不下沉到基线)"
      source: "攀钢综述 [C]≥3.1%; 建龙 p22 >3.2%; 承德 p30 ≥3.5%"

  # -------------------------------------------------------------------
  # 质量通用判据
  # -------------------------------------------------------------------
  quality:
    v_si_ti_ratio_min:
      value: 1.0
      unit: dimensionless
      source: "行业通用: V/(Si+Ti)<1 提示渣品位可能不达标 (硅稀释效应)"
    si_dilution:
      value: "高 Si 稀释钒渣品位, Si 每升 0.01% 品位约降 0.2~0.3pp"
      source: "VERO_MVP 敏感性曲线; 建龙 p12「Si 氧化成 SiO2 对钒渣有稀释作用」"

  # -------------------------------------------------------------------
  # 供氧通用原则
  # -------------------------------------------------------------------
  oxygen_principle:
    lance_control:
      value: "恒压变枪"
      desc: "供氧压力恒定, 通过变枪位调节搅拌与氧化强度"
      source: "建龙 p16「一般采用恒压变枪位操作」; 讲课稿 p15"

# ---------------------------------------------------------------------
# 行业基线内部口径冲突
# ---------------------------------------------------------------------
known_conflicts:
  - id: CF-007
    topic: "碳钒转化温度 Tc"
    sources:
      thermodynamic: "Tc = 1361℃ (1634K), 吉布斯 ΔG7=-250170+153.09T → T转=250170/153.09"
      config_py: "temp_critical_v_c_switch = 1360.0 (四舍五入, 且当前未被 kinetics 引用, 属死配置)"
      kinetics_sigmoid: "tc_transition = 1380.0 (sigmoid 软切换中心, 非热力学 Tc)"
      diagnose: "「Tc ~ 1360-1380℃」「终点<1380℃」「返干 Temp>1380」等操作阈值"
    arbitration: "Tc 统一取 1361℃; 1380 为动力学软切换中心/操作阈值, 与 Tc 分离命名, 不改物理值"
    resolved_by: "2026-09-23 文献核对"
  - id: CF-008
    topic: "V/(Si+Ti) 富集判据阈值"
    sources:
      initial_charge: "行业基线 quality.v_si_ti_ratio_min = 1.0, 预警「渣品位可能不达标」"
      diagnose: "旧值 1.01, 判「Raw Material Deficit」(现已对齐 1.0)"
      prd_v6: "1.05 判「极难富集」(PRD 参考性最低, 已弃)"
    arbitration: "统一取 1.0 —— V/(Si+Ti) 为连续质量指标, 无文献硬阈值; 建龙生产数据 1.01 已属偏低, 1.2 以上良好; 1.0 语义清晰(钒少于脉石 Si+Ti 即难富集)"
    resolved_by: "2026-09-23 建龙规程 p38/p40 核对"
