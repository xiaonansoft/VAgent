# =====================================================================
# 建龙提钒 L1 配料知识包 (VEES Knowledge Pack)
# =====================================================================
# 来源: 黑龙江建龙转炉提钒技术材料--修改--2020.6.13(1).pdf (规程查表法)
# 对应引擎: backend/app/tools/initial_charge.py (L1 静态配料, 建龙查表口径)
# 作用域: plant=jianlong —— 厂级包, 由 resolve_parameters() 以「行业基线(industry)打底」
#         合并覆盖; 产品本身面向提钒冶炼行业, 建龙仅为当前默认部署厂。
#
# 每个参数必备字段: value(值) / unit(单位) / source(溯源)
# 与攀钢包的已知冲突见 pangang/base.yaml 的 known_conflicts (CF-001~CF-005)
# =====================================================================

schema: vees.knowledge-pack/v1
pack:
  plant: jianlong
  scope: plant
  name: 建龙提钒L1配料知识包
  version: 1.0.0
  source_pdf: "黑龙江建龙转炉提钒技术材料--修改--2020.6.13(1).pdf (查表法)"
  status: draft
  approved_by: []

parameters:

  # -------------------------------------------------------------------
  # L1 配料: 冷却剂查表 + 温度修正 (对应 MODEL_ALGORITHM.md §1)
  # -------------------------------------------------------------------
  l1_charge:
    target_temp_c:
      value: 1380.0
      unit: "°C"
      source: "建龙规程: 半钢温度 1360-1400 (取中值 1380)"
      desc: "半钢目标温度 (当前代码未参与计算, 仅作口径记录)"
    temp_base_c:
      value: 1300.0
      unit: "°C"
      source: "建龙规程: 查表基准温度"
    coolant_lookup_kg_t:                 # 1300°C 基准冷却剂 kg/t, 按 Si 分档
      si_le_015:
        value: 22.5
        unit: "kg/t"
        source: "建龙规程 Si<=0.15% 档 (15-30 取中值)"
      si_015_020:
        value: 33.0
        unit: "kg/t"
        source: "建龙规程 0.15<Si<=0.20% 档 (30-36 取中值)"
      si_020_025:
        value: 39.0
        unit: "kg/t"
        source: "建龙规程 0.20<Si<=0.25% 档 (36-42 取中值)"
      si_gt_025:
        value: 45.0
        unit: "kg/t"
        source: "建龙规程 Si>0.25% 档 (42-48 取中值)"
    temp_correction_kg_t_per_c:
      value: 0.18
      unit: "kg/t/°C"
      source: "建龙规程: 每 +10°C 增 1.8 kg/t"
    lining_heat_correction_c_per_unit:
      value: 0.5
      unit: "°C/单位蓄热"
      source: "initial_charge.py 启发式: 1 单位炉衬蓄热 ≈ 0.5°C 等效升温"

  # -------------------------------------------------------------------
  # L1 冷却剂分配策略 (优先级: 钒渣铁 > 氧化铁皮 > 球返/球团)
  # -------------------------------------------------------------------
  coolant_distribution:
    v_slag_iron:
      si_threshold: {value: 0.20, unit: "%", source: "建龙规程: Si>=0.20% 配加返铁调温"}
      share:        {value: 0.5,  unit: "fraction", desc: "占总冷却剂比例上限"}
      cap_t:        {value: 2.0,  unit: "t", desc: "钒渣铁上限"}
    scale:
      share: {value: 0.3, unit: "fraction", desc: "氧化铁皮占剩余比例"}
      cap_t: {value: 0.5, unit: "t", desc: "氧化铁皮上限"}
    pellet_cap_t:
      value: 2.5
      unit: "t"
      source: "建龙规程: 球返加入量不超过 2.5t"
      desc: "超过触发警告, 建议检查铁水温度或增加废钢/生铁"

  # -------------------------------------------------------------------
  # L1 氧量计算 (m3/kg 系数 + 效率 + 半钢目标成分)
  # -------------------------------------------------------------------
  oxygen:
    coeff_si_m3_kg: {value: 0.8,  unit: "m3/kg", source: "MODEL_ALGORITHM.md §1"}
    coeff_c_m3_kg:  {value: 0.93, unit: "m3/kg", source: "MODEL_ALGORITHM.md §1"}
    coeff_v_m3_kg:  {value: 0.35, unit: "m3/kg", source: "initial_charge.py (V→V2O3 化学计量修正)"}
    coeff_ti_m3_kg: {value: 0.5,  unit: "m3/kg", source: "MODEL_ALGORITHM.md §1"}
    efficiency:     {value: 0.9,  unit: "fraction", desc: "氧耗效率修正 (÷0.9)"}
    target_c_pct:   {value: 3.50, unit: "%", desc: "半钢碳目标"}
    target_v_pct:   {value: 0.05, unit: "%", desc: "半钢残钒目标 (氧化率 90%)"}
    target_p_pct:   {value: 0.10, unit: "%", desc: "P 氧化基准 (代码中 delta_mn 误用 P, 保留现状)"}

  # -------------------------------------------------------------------
  # L1 渣量预测 (成分系数 + 冷料带渣 + 非铁氧化物占比)
  # -------------------------------------------------------------------
  slag:
    coeff_sio2: {value: 2.14, unit: "kg/kg", source: "PRD Source 106: W_slag=2.14ΔSi+1.79ΔV"}
    coeff_v2o3: {value: 1.47, unit: "kg/kg", source: "initial_charge.py (V2O3 折算)"}
    coeff_tio2: {value: 1.67, unit: "kg/kg", source: "initial_charge.py (TiO2 折算)"}
    coolant_sio2_share: {value: 0.05, unit: "fraction", desc: "冷料(球团+钒渣铁)带入 SiO2 ≈ 5%"}
    non_ferrous_divisor: {value: 0.6, unit: "fraction", desc: "FeO+MnO+其他 ≈ 40%, 故 ÷0.6"}

  # -------------------------------------------------------------------
  # 枪位控制 (行业通用模式 + 厂级默认值 —— lance_profile 单一事实来源)
  # -------------------------------------------------------------------
  lance_profile:
    si_threshold_pct:
      value: 0.20
      unit: "%"
      source: "行业通用: 高Si保持下限; 建龙 p22 阈值 0.2% 为厂级默认值"
    low_lance_mm:
      value: 900
      unit: "mm"
      source: "黑龙江建龙 p22/p16: 低枪位 900~1000mm; 高硅时枪位保持下限(=900)"
    high_lance_mm:
      value: 1200
      unit: "mm"
      source: "黑龙江建龙 p22: 高枪位 1100~1400mm (取代表值)"
    low_high_low_timing:
      low_until_min: {value: 2.0, unit: "min", source: "黑龙江建龙 p22: 吹炼0~2分钟低枪位"}
      end_press_s:   {value: 40,   unit: "s",   source: "黑龙江建龙 p22: 吹氧结束前40秒低枪位"}
      total_blow_min: {value: 5.5, unit: "min", source: "讲课稿: 纯供氧5~6.5min (取5.5)"}

# ---------------------------------------------------------------------
# 建龙内部口径冲突 (原代码与规程/PRD 三方不一致)
# ---------------------------------------------------------------------
known_conflicts:
  - id: CF-006
    topic: "枪位控制策略"
    sources:
      prd_v6: "高Si(>0.20%) → 恒定低枪位 900-1000mm; 低Si(≤0.20%) → 低-高-低"
      code_original: "恒压变枪 高→低, 三档 Si<0.15/0.15-0.30/>0.30 → 过程枪位 1.5/1.4/1.3m (实为承德建龙 p30 表)"
      chengde_p30: "单流道四孔拉瓦尔, 恒压变枪, Si<0.15/0.15-0.30/>0.30 → 过程枪位 1.5/1.4/1.3m"
      heilongjiang_p22: "328氧枪, Si<0.2% 低-高-低(低900-1000/高1100-1400); Si>0.2% 全过程低枪位"
    arbitration: "枪位模式(低-高-低 + 高Si保持下限)为行业通用, 攀钢综述/讲课稿/建龙/专利多方一致; 阈值0.2%与枪位值900/1200mm为厂级默认参数(参考建龙), 可被厂级包覆盖"
    resolved_by: "2026-09-23 文献核对"
