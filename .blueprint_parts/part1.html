<!DOCTYPE html>
<!--
====================================================================
 VERO_FULLCHAIN_BLUEPRINT.html · 编辑指南（给工程师）
====================================================================
这份文件是「单文件、零构建、零 CDN」的可编辑蓝图文档。全部内容都在
语义 HTML 里，直接改文字即可生效。常见操作：

1) 改正文文字
   方法 A：VS Code 打开本文件，搜索关键词直接改 HTML 里的文字。
   方法 B：浏览器打开本文件 → 点顶栏「编辑模式」按钮（pen-line 图标）
           → 直接点击页面文字修改 → 改完全选复制带走；再点一次按钮关闭。

2) 给表格加一行（如 §5 模块清单）
   复制任意 <tr>...</tr> 整段，改单元格内容。状态徽章只许用四种：
   <span class="pill pill-done">已完成</span>
   <span class="pill pill-run">进行中</span>
   <span class="pill pill-todo">待启动</span>
   <span class="pill pill-pending"><svg class="icon icon-12" aria-hidden="true"><use href="#i-help-circle"/></svg>待厂级确认</span>
   厂情徽章只许三种：.badge-plant-a（攀钢西昌）/ .badge-plant-b（承德建龙）/ .badge-common（通用）。

3) 改 §3 架构总图节点
   §3 总图是纯 HTML/CSS Grid：搜 <div class="node 改文字即可；
   新增节点复制一个 .node 块。域色只用三类：node-v（提钒橙）/
   node-s（炼钢钢蓝）/ node-c（公共灰），禁止引入第四种域色。

4) 改 §4 数据流大图
   §4 是手写内联 SVG，文字全部是可直改的 <text> 元素。
   F12 定位或 VS Code 搜索节点分组 id（如 id="node-m5"）。
   坐标吸附 8px 网格；颜色一律 fill="var(--xxx)"，禁止写死色值。
   渐变只允许 grad-handover 一处（双工序交接箭头），勿新增渐变。

5) 换肤（改 3 个变量）
   文件头 <style> 顶部是完整 Design Tokens。换主题只改 A1 层三个值：
   --c-molten-600（铁水橙）/ --c-steel-700（钢蓝）/ --c-paper-100（纸面底），
   全文档自动生效。正文样式禁止写新色值（#fff/#000 除外）。

6) 图标
   只允许 <body> 开头 sprite 里的 30 个 Lucide 图标（id 以 i- 开头），
   用法：<svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>
   禁止 emoji 图标、禁止引入第二图标库。

7) 深链
   每个章节 <section id="sec-N">、小节 id="sec-N-M"。
   引用写法：<a class="xref" href="#sec-5-2">§5.2</a>。
====================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERO 双工序全流程智能体升级蓝图 v1.0</title>
<meta name="description" content="提钒→半钢双联全流程可解释推荐智能体系统蓝图：冶炼前配料优化、冶炼中实时推荐、冶炼后质量复盘，三阶段×两工序全覆盖，适配攀钢西昌/承德建龙双厂。">
<style>
/* ============================================================
   VERO 提钒-炼钢全链路 · 蓝图文档 Design Tokens
   版本 v1.0 · 2026-09-28 · 设计师：颜好看
   用途：VERO_FULLCHAIN_BLUEPRINT.html（可编辑单文件 HTML 蓝图）
   原则：全文档零硬编码色值（唯 #fff/#000 例外），改此处即全局生效
   分层：A1 原始层 → A2 语义层 → B 组件层 → C 项目扩展层
   ============================================================ */

:root {

  /* ========== A1 · Primitive 原始层（只定义，不直接使用） ========== */

  /* --- 中性墨色阶（承袭 v0.2 ink #141D2B，统一两版墨色） --- */
  --c-ink-900: #141D2B;   /* 主墨 · 标题/正文 */
  --c-ink-700: #3D4A5F;   /* 次级墨 · 表格正文/说明 */
  --c-ink-500: #6B7686;   /* 弱化墨 · 辅助说明（白底 4.6:1） */
  --c-ink-400: #98A1AE;   /* 元信息 · 时间戳/来源标注（仅限 ≥12px 辅助） */

  /* --- 纸面阶（工程图纸冷灰，替代旧暖纸 #F5F2EC，见决策记录） --- */
  --c-paper-100: #F6F7F9; /* 页面底 */
  --c-paper-0:   #FFFFFF; /* 卡面 */
  --c-paper-200: #EFF1F4; /* 下沉面（代码块/表头/内嵌面板） */

  /* --- 线阶 --- */
  --c-line-300: #E2E5EA;  /* 主分隔线/卡片描边 */
  --c-line-200: #EBEEF2;  /* 表格内行线/软分隔 */

  /* --- 品牌色 · 铁水橙（提钒域 DNA，承袭 v0.9 --c-accent） --- */
  --c-molten-600: #E8590C;  /* 图形/大字号(≥18px 590)/徽章底 */
  --c-molten-700: #C2410C;  /* 文本安全橙（白底 5.2:1）· 链接/强调文字 */
  --c-molten-100: #FDEEE3;  /* 橙浅底（tint 面板/选中态底色） */

  /* --- 品牌色 · 钢蓝（炼钢域 DNA，承袭 v0.2 --steel） --- */
  --c-steel-700: #2B4A6F;   /* 炼钢域图形/标题装饰 */
  --c-steel-100: #E7EEF5;   /* 钢蓝浅底 */

  /* --- 语义色（承袭 v0.2 ok/warn/danger/blue，微调可读性） --- */
  --c-ok-600:     #2B8A3E;  --c-ok-100:     #E4F3E7;
  --c-warn-600:   #B54708;  --c-warn-100:   #FCF0DC;
  --c-danger-600: #C92A2A;  --c-danger-100: #FBEAEA;
  --c-info-600:   #1971C2;  --c-info-100:   #E2EFFA;

  /* ========== A2 · Semantic 语义层（页面样式只引用这一层） ========== */

  /* 表面 */
  --bg:             var(--c-paper-100);
  --surface:        var(--c-paper-0);
  --surface-sunken: var(--c-paper-200);

  /* 前景 */
  --fg:    var(--c-ink-900);
  --fg-2:  var(--c-ink-700);
  --muted: var(--c-ink-500);
  --meta:  var(--c-ink-400);

  /* 边框 */
  --border:      var(--c-line-300);
  --border-soft: var(--c-line-200);

  /* 强调（每屏可见使用 ≤ 2 处） */
  --accent:      var(--c-molten-600);
  --accent-text: var(--c-molten-700);
  --accent-tint: var(--c-molten-100);
  --accent-hover:  #D9480F;   /* hover 态深一档 */
  --accent-active: #B84E0C;   /* 按下态（承袭 v0.9 --c-accent-d） */

  /* 副强调 */
  --steel:      var(--c-steel-700);
  --steel-tint: var(--c-steel-100);

  /* 语义状态 */
  --success: var(--c-ok-600);     --success-tint: var(--c-ok-100);
  --warn:    var(--c-warn-600);   --warn-tint:    var(--c-warn-100);
  --danger:  var(--c-danger-600); --danger-tint:  var(--c-danger-100);
  --info:    var(--c-info-600);   --info-tint:    var(--c-info-100);

  /* ========== C · Extension 项目扩展层（VERO 蓝图专属） ========== */

  /* 工艺域色标 —— 全文档所有架构图/数据流图/表格阶段列的唯一色彩依据
     橙 = 提钒域（铁水→钒渣），钢蓝 = 炼钢域（半钢→钢），灰 = 公共底座
     禁止为"好看"引入第四种域色 */
  --domain-vanadium: var(--c-molten-600);   /* 提钒域 */
  --domain-vanadium-tint: var(--c-molten-100);
  --domain-steel:    var(--c-steel-700);    /* 炼钢域 */
  --domain-steel-tint: var(--c-steel-100);
  --domain-common:   var(--c-ink-500);      /* 公共底座/基础设施 */
  --domain-common-tint: var(--c-paper-200);

  /* 排版（离线优先字体栈：本机无 Inter 时优雅降级 PingFang/雅黑） */
  --font-display: "Inter", "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body:    "Inter", "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", "Cascadia Code", "SF Mono", "Menlo", "Consolas", monospace;

  --fs-cap:  12px;  --lh-cap: 1.5;    /* 标签/徽章/轴标注 */
  --fs-sm:   13px;  --lh-sm: 1.6;     /* 辅助文字 */
  --fs-body: 14px;  --lh-body: 1.75;  /* 正文（长读文档基准） */
  --fs-md:   15px;  --lh-md: 1.7;     /* 强调正文/列表 */
  --fs-h3:   16px;  --lh-h3: 1.5;     /* 三级标题 */
  --fs-h2:   20px;  --lh-h2: 1.4;     /* 二级标题（章节） */
  --fs-h1:   26px;  --lh-h1: 1.3;     /* 一级标题 */
  --fs-doc:  34px;  --lh-doc: 1.25;   /* 文档题名 */

  /* 字距：ALL CAPS ≥0.06em；≥24px 标题 -0.01em；正文 0 */
  --tracking-caps: 0.06em;
  --tracking-title: -0.01em;

  /* 数字：所有数据表格/坐标轴/KPI 强制 tabular-nums（承袭现有约定） */
  --num: tabular-nums;

  /* 间距（4px 网格，承袭 v0.9 --s1~--s6 命名） */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  /* 圆角（承袭 v0.9，卡片上限 12px） */
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-pill: 999px;

  /* 阴影（文档风克制策略：优先 1px 边框，阴影仅两级） */
  --shadow-1: 0 1px 2px rgba(20, 29, 43, 0.05);
  --shadow-2: 0 4px 12px rgba(20, 29, 43, 0.08);
  --elev-ring: 0 0 0 1px var(--border);

  /* 焦点与动效 */
  --focus-ring: 0 0 0 3px rgba(232, 89, 12, 0.35);
  --motion-fast: 120ms;   /* 折叠/悬停 */
  --motion-base: 180ms;   /* 导航高亮/抽屉 */
  --ease: cubic-bezier(0.2, 0, 0, 1);

  /* 布局 */
  --container-max: 1200px;      /* 内容主列最大宽 */
  --toc-width: 216px;           /* 左侧目录列 */
  --gutter: 24px;               /* 栅格沟槽 */
  --section-y: 56px;            /* 章节纵向节奏 */
}

/* ========== B · Slot 组件层（蓝图文档核心组件，直接可用的类） ========== */

/* 图标 —— Lucide 内联 sprite，统一 24 网格描边，尺寸 16/20/24 */
.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2;
        fill: none; stroke-linecap: round; stroke-linejoin: round;
        flex: none; vertical-align: -0.15em; }
.icon-12 { width: 12px; height: 12px; }
.icon-20 { width: 20px; height: 20px; }
.icon-24 { width: 24px; height: 24px; }

/* 状态徽章 —— 承袭现有 pill 语言（done/run/todo），仅换 Token */
.pill { display: inline-flex; align-items: center; gap: var(--s1);
        font-size: var(--fs-cap); font-weight: 600; line-height: var(--lh-cap);
        padding: 2px 10px; border-radius: var(--r-pill); white-space: nowrap; }
.pill-done { background: var(--success-tint); color: var(--success); }
.pill-run  { background: var(--warn-tint);    color: var(--warn); }
.pill-todo { background: var(--surface-sunken); color: var(--muted); }
.pill-info { background: var(--info-tint);    color: var(--info); }
.pill-pending { background: var(--info-tint); color: var(--info); }

/* 章节号 —— 功能性交叉引用锚（§3.2 可被正文引用），非装饰 */
.sec-no { font-family: var(--font-mono); font-size: var(--fs-cap);
          color: var(--accent-text); font-weight: 600;
          font-variant-numeric: var(--num); }

/* 数据表格 —— 工程师日常对照的核心组件 */
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm);
       background: var(--surface); border: 1px solid var(--border); }
.tbl th { background: var(--surface-sunken); color: var(--fg-2); text-align: left;
          padding: 8px 12px; font-weight: 600; font-size: var(--fs-cap); }
.tbl td { padding: 8px 12px; border-top: 1px solid var(--border-soft);
          color: var(--fg-2); vertical-align: top;
          font-variant-numeric: var(--num); }
.tbl td b { color: var(--fg); }

/* 代码/路径 —— 等宽 + 下沉面 */
.code { font-family: var(--font-mono); font-size: var(--fs-sm);
        background: var(--surface-sunken); color: var(--fg-2);
        padding: 1px 6px; border-radius: var(--r-sm); }

/* 架构图层带 —— 分层横条（HTML/CSS Grid 实现，文字直改） */
.layer { border: 1px solid var(--border); border-radius: var(--r-md);
         background: var(--surface); padding: var(--s3) var(--s4); }
.layer-head { font-family: var(--font-mono); font-size: var(--fs-cap);
              font-weight: 600; color: var(--meta); letter-spacing: var(--tracking-caps); }

/* 域色标 —— 图例统一出处 */
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot-vanadium { background: var(--domain-vanadium); }
.dot-steel    { background: var(--domain-steel); }
.dot-common   { background: var(--domain-common); }
